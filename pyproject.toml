[project]
name = "skynet"
version = "0.1a13"
description = "Decentralized compute platform"
authors = [{ name = "Guillermo Rodriguez", email = "guillermo@telos.net" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
    "pytz~=2023.3.post1",
    "trio>=0.22.2,<0.23",
    "Pillow>=10.0.1,<11",
    "docker>=6.1.3,<7",
    "py-leap",
    "toml>=0.10.2,<0.11",
    "msgspec>=0.19.0,<0.20",
    "numpy<2.1",
    "protobuf>=5.29.3,<6",
    "zstandard>=0.23.0,<0.24",
    "click>=8.1.8,<9",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
skynet = "skynet.cli:skynet"
txt2img = "skynet.cli:txt2img"
img2img = "skynet.cli:img2img"
upscale = "skynet.cli:upscale"
inpaint = "skynet.cli:inpaint"

[dependency-groups]
frontend = [
    "triopg>=0.6.0,<0.7",
    "aiohttp>=3.8.5,<4",
    "psycopg2-binary>=2.9.7,<3",
    "pyTelegramBotAPI>=4.14.0,<5",
    "discord.py>=2.3.2,<3",
]
dev = [
    "pdbpp>=0.10.3,<0.11",
    "pytest>=7.4.2,<8",
    "pytest-trio>=0.8.0,<0.9",
]
cuda = [
    "torch==2.5.1+cu121",
    "scipy==1.15.1",
    "numba==0.60.0",
    "quart>=0.19.3,<0.20",
    "triton==3.1.0",
    "xformers>=0.0.29,<0.0.30",
    "hypercorn>=0.14.4,<0.15",
    "diffusers==0.32.1",
    "quart-trio>=0.11.0,<0.12",
    "torchvision==0.20.1+cu121",
    "accelerate==0.34.0",
    "transformers==4.48.0",
    "huggingface-hub>=0.27.1,<0.28",
    "invisible-watermark>=0.2.0,<0.3",
    "bitsandbytes>=0.45.0,<0.46",
    "basicsr>=1.4.2,<2",
    "realesrgan>=0.3.0,<0.4",
    "sentencepiece>=0.2.0",
]

[tool.uv]
default-groups = [
    "frontend",
    "dev",
    "cuda",
]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "torch" }
triton = { index = "torch" }
torchvision = { index = "torch" }
py-leap = { git = "https://github.com/guilledk/py-leap.git", rev = "v0.1a32" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
